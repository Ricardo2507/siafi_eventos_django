<table><thead><tr><th>Evento</th><th>Especificação</th><th>Contas</th></tr></thead><tbody>{% for e in eventos %}<tr><td><a href="{% url 'evento_detail' e.codigo %}">{{ e.codigo }}</a></td><td>{{ e.especificacao|truncatechars:220 }}</td><td>{{ e.total_contas|default:e.lancamentos.count }}</td></tr>{% empty %}<tr><td colspan="3">Nenhum evento encontrado.</td></tr>{% endfor %}</tbody></table>
