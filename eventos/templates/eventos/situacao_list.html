{% extends 'eventos/base.html' %}{% block content %}<h1>Situações</h1><form class="search"><input name="q" value="{{ q }}" placeholder="Buscar situação, ex.: IMB061"><button>Buscar</button></form>{% for s in page_obj %}<div class="card"><h3><a href="{% url 'situacao_detail' s.codigo %}">{{ s.codigo }}</a> - {{ s.titulo }}</h3><p>{{ s.descricao }}</p></div>{% empty %}<p>Nenhuma situação cadastrada.</p>{% endfor %}{% endblock %}
